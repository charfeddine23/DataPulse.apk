name: Android Release Build & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Version Info from build.gradle.kts
        id: extract_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | head -n 1 | awk '{print $3}')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.0"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="1"; fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          # Check if tag already exists to prevent duplicate tag failure
          if git rev-parse "v${VERSION_NAME}" >/dev/null 2>&1; then
            echo "TAG_NAME=v${VERSION_NAME}-build${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v${VERSION_NAME}" >> $GITHUB_ENV
          fi
          echo "Version extracted: v$VERSION_NAME (code: $VERSION_CODE)"

      - name: Restore Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_DEST="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DEST"
          elif [ -f "$KEYSTORE_DEST" ]; then
            echo "Using existing signing keystore committed in repository at $KEYSTORE_DEST"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set and no keystore found. Generating fallback self-signed keystore for build testing..."
            rm -f "$KEYSTORE_DEST"
            keytool -genkeypair -v -keystore "$KEYSTORE_DEST" -storepass "${STORE_PASS:-android}" \
              -alias upload -keypass "${KEY_PASS:-android}" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DataPulse, OU=Mobile, O=CharfeddineKa, L=Tunis, C=TN" -noprompt
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_DEST" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${STORE_PASS:-android}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASS:-android}" >> $GITHUB_ENV

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH || format('{0}/my-upload-key.jks', github.workspace) }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD || secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD || 'android' }}
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, ensuring wrapper is ready..."
            gradle wrapper || true
          fi
          chmod +x ./gradlew

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Keystore file missing at $KEYSTORE_PATH, creating fallback upload keystore..."
            rm -f "$KEYSTORE_PATH"
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" -alias upload \
              -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DataPulse, OU=Mobile, O=CharfeddineKa, L=Tunis, C=TN" -noprompt
          fi

          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          APK_SRC=$(find "$RELEASE_DIR" -name "*.apk" | head -n 1)

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "Error: Release APK not found in $RELEASE_DIR"
            exit 1
          fi

          FINAL_APK_NAME="DataPulse-v${{ env.VERSION_NAME }}.apk"
          cp "$APK_SRC" "./$FINAL_APK_NAME"
          sha256sum "./$FINAL_APK_NAME" > "./${FINAL_APK_NAME}.sha256"

          echo "APK successfully prepared: $FINAL_APK_NAME"
          echo "FINAL_APK_PATH=./$FINAL_APK_NAME" >> $GITHUB_ENV
          echo "FINAL_SHA_PATH=./${FINAL_APK_NAME}.sha256" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Data Pulse ${{ env.TAG_NAME }}"
          body: |
            ### 🚀 Data Pulse - Release ${{ env.TAG_NAME }}
            
            **Developer:** Charfeddine Ka
            **Version Name:** `${{ env.VERSION_NAME }}`
            **Version Code:** `${{ env.VERSION_CODE }}`
            **Built On:** ${{ github.event.head_commit.timestamp || 'Automated CI/CD' }}
            **Commit:** `${{ github.sha }}`
            
            #### 🌟 Highlights & Features in this Release:
            - **Modern Liquid Glass UI**: Dark mode aesthetic with translucent glass cards, neon pulse indicators, and responsive charts.
            - **Live Speed Meter**: Real-time download/upload monitoring (Kbps/Mbps) and continuous waveform sparkline.
            - **Data Tracking & Analytics**: Comprehensive breakdown for Mobile Data (Cellular) and Wi-Fi (Today & Monthly).
            - **App-by-App Usage**: Identify high-consumption applications with custom search and interface filtering.
            - **Quotas & Smart Alerts**: Custom data plan limits with visual progress and warning triggers at 80% & 95%.
            - **Dual SIM Support**: Cellular subscription tracking and carrier detection.
            
            #### 📦 Verification & Assets:
            - **APK:** `${{ env.FINAL_APK_PATH }}`
            - SHA256 Checksum attached below.
          files: |
            ${{ env.FINAL_APK_PATH }}
            ${{ env.FINAL_SHA_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
