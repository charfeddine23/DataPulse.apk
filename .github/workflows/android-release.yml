name: Android Release Build & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Auto-Increment Version & Extract App Name
        id: bump_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PY'
          import json, os, re, subprocess

          gradle_path = "app/build.gradle.kts"
          with open(gradle_path, "r", encoding="utf-8") as f:
              gradle_text = f.read()

          m_code = re.search(r"versionCode\s*=\s*(\d+)", gradle_text)
          m_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_text)

          gradle_code = int(m_code.group(1)) if m_code else 1
          gradle_ver_str = m_name.group(1) if m_name else "1.0.1"

          def parse_ver(v):
              m = re.search(r"(\d+)\.(\d+)\.(\d+)", v)
              if m:
                  return (int(m.group(1)), int(m.group(2)), int(m.group(3)))
              m2 = re.search(r"(\d+)\.(\d+)", v)
              if m2:
                  return (int(m2.group(1)), int(m2.group(2)), 0)
              return (1, 0, 1)

          max_ver = parse_ver(gradle_ver_str)
          max_code = gradle_code

          # Also check existing GitHub Releases so version always advances even if gradle wasn't synced back
          try:
              out = subprocess.check_output(
                  ["gh", "api", "--paginate", f"repos/{os.environ['REPO']}/releases?per_page=100"],
                  text=True
              )
              dec = json.JSONDecoder()
              s = out.lstrip()
              idx = 0
              while idx < len(s):
                  chunk, next_idx = dec.raw_decode(s, idx)
                  if isinstance(chunk, list):
                      for rel in chunk:
                          for field in (rel.get("tag_name", ""), rel.get("name", "")):
                              if re.search(r"\d+\.\d+\.\d+", field):
                                  v = parse_ver(field)
                                  if v > max_ver:
                                      max_ver = v
                          body = rel.get("body") or ""
                          mc = re.search(r"\*\*Version Code:\*\*\s*`(\d+)`", body)
                          if mc:
                              max_code = max(max_code, int(mc.group(1)))
                  idx = next_idx
                  while idx < len(s) and s[idx].isspace():
                      idx += 1
          except Exception as e:
              print(f"Note: skipping remote release lookup ({e})")

          major, minor, patch = max_ver
          if major < 1:
              major = 1
          if patch >= 9:
              minor += 1
              patch = 0
          else:
              patch += 1

          new_ver = f"{major}.{minor}.{patch}"
          new_code = max_code + 1

          # Update app/build.gradle.kts with the new versionCode & versionName
          gradle_text = re.sub(r"(versionCode\s*=\s*)\d+", rf"\g<1>{new_code}", gradle_text, count=1)
          gradle_text = re.sub(r'(versionName\s*=\s*")[^"]+(")', rf'\g<1>{new_ver}\g<2>', gradle_text, count=1)
          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(gradle_text)

          # Extract app name from res/values/strings.xml
          app_name = "Data Pulse"
          strings_path = "app/src/main/res/values/strings.xml"
          if os.path.exists(strings_path):
              with open(strings_path, "r", encoding="utf-8") as sf:
                  sm = re.search(r'<string\s+name="app_name">([^<]+)</string>', sf.read())
                  if sm:
                      app_name = sm.group(1).strip()

          apk_prefix = re.sub(r"\s+", ".", app_name)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as ef:
              ef.write(f"APP_NAME={app_name}\n")
              ef.write(f"APK_PREFIX={apk_prefix}\n")
              ef.write(f"VERSION_NAME={new_ver}\n")
              ef.write(f"VERSION_CODE={new_code}\n")
              ef.write(f"TAG_NAME=v{new_ver}\n")

          print(f"Auto-bumped version to v{new_ver} (versionCode={new_code}) for {app_name}")
          PY

      - name: Restore Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_DEST="${{ github.workspace }}/my-upload-key.jks"
          STORE_PASS_RESOLVED="${STORE_PASS:-android}"
          KEY_PASS_RESOLVED="${KEY_PASS:-android}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DEST"
          elif [ -f "$KEYSTORE_DEST" ]; then
            echo "Using existing signing keystore committed in repository at $KEYSTORE_DEST"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set and no keystore found. Generating fallback self-signed keystore for build testing..."
            rm -f "$KEYSTORE_DEST"
            keytool -genkeypair -v -keystore "$KEYSTORE_DEST" -storepass "$STORE_PASS_RESOLVED" \
              -alias upload -keypass "$KEY_PASS_RESOLVED" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DataPulse, OU=Mobile, O=CharfeddineKa, L=Tunis, C=TN" -noprompt
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_DEST" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS_RESOLVED" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS_RESOLVED" >> $GITHUB_ENV

      - name: Build Signed Release APK
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, ensuring wrapper is ready..."
            gradle wrapper || true
          fi
          chmod +x ./gradlew

          KEYSTORE_FILE="${KEYSTORE_PATH:-${{ github.workspace }}/my-upload-key.jks}"
          export KEYSTORE_PATH="$KEYSTORE_FILE"
          export STORE_PASSWORD="${STORE_PASSWORD:-android}"
          export KEY_PASSWORD="${KEY_PASSWORD:-android}"

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Keystore file missing at $KEYSTORE_PATH, creating upload keystore..."
            rm -f "$KEYSTORE_PATH"
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" -alias upload \
              -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DataPulse, OU=Mobile, O=CharfeddineKa, L=Tunis, C=TN" -noprompt
          fi

          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          APK_SRC=$(find "$RELEASE_DIR" -name "*.apk" | head -n 1)

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "Error: Release APK not found in $RELEASE_DIR"
            exit 1
          fi

          FINAL_APK_NAME="${{ env.APK_PREFIX }}.v${{ env.VERSION_NAME }}.apk"
          cp "$APK_SRC" "./$FINAL_APK_NAME"
          sha256sum "./$FINAL_APK_NAME" > "./${FINAL_APK_NAME}.sha256"

          echo "APK successfully prepared: $FINAL_APK_NAME"
          echo "FINAL_APK_PATH=./$FINAL_APK_NAME" >> $GITHUB_ENV
          echo "FINAL_SHA_PATH=./${FINAL_APK_NAME}.sha256" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "${{ env.APP_NAME }}.v${{ env.VERSION_NAME }}.apk"
          body: |
            ### 🚀 ${{ env.APP_NAME }} - Release v${{ env.VERSION_NAME }}
            
            **Developer:** Charfeddine Ka
            **Version Name:** `${{ env.VERSION_NAME }}`
            **Version Code:** `${{ env.VERSION_CODE }}`
            **Built On:** ${{ github.event.head_commit.timestamp || 'Automated CI/CD' }}
            **Commit:** `${{ github.sha }}`
            
            #### 🌟 Highlights & Features in this Release:
            - **Modern Liquid Glass UI**: Pearl & Platinum Light Mode + Multi-Theme Dark Glass aesthetics.
            - **Live Speed Meter**: Real-time download/upload monitoring (Kbps/Mbps) and continuous waveform sparkline.
            - **Data Tracking & Analytics**: Comprehensive breakdown for Mobile Data (Cellular) and Wi-Fi (Today & Monthly).
            - **App-by-App Usage**: Identify high-consumption applications with compact cycling filters & custom limits.
            - **All-Time Rank**: Leaderboard ranking top data-consuming apps across Wi-Fi & Cellular.
            - **Quotas & Smart Alerts**: Custom data plan limits with visual progress and warning triggers at 80% & 95%.
            - **Dual SIM Support**: Cellular subscription tracking and carrier detection.
            
            #### 📦 Verification & Assets:
            - **APK:** `${{ env.APK_PREFIX }}.v${{ env.VERSION_NAME }}.apk`
            - SHA256 Checksum attached below.
          files: |
            ${{ env.FINAL_APK_PATH }}
            ${{ env.FINAL_SHA_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Version Bump
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet app/build.gradle.kts; then
            git add app/build.gradle.kts
            git commit -m "chore: bump version to v${{ env.VERSION_NAME }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "::warning::Could not push version bump commit (protected branch or concurrent push)."
          fi

      - name: Cleanup Old Releases & Actions (Keep Latest Only)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ env.TAG_NAME }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          echo "Cleaning up old Releases (keeping tag: $CURRENT_TAG)..."
          gh api --paginate "repos/${REPO}/releases?per_page=100" \
            | jq -rs --arg tag "$CURRENT_TAG" 'add // [] | .[] | select(.tag_name != $tag) | "\(.id)\t\(.tag_name)"' \
            | while IFS=$'\t' read -r RELEASE_ID OLD_TAG; do
                if [ -n "$RELEASE_ID" ]; then
                  echo "Deleting old release ID=$RELEASE_ID (tag: $OLD_TAG)"
                  gh api -X DELETE "repos/${REPO}/releases/${RELEASE_ID}" || true
                fi
                if [ -n "$OLD_TAG" ]; then
                  echo "Deleting old release tag: $OLD_TAG"
                  gh api -X DELETE "repos/${REPO}/git/refs/tags/${OLD_TAG}" || true
                fi
              done

          echo "Cleaning up old GitHub Actions workflow runs (keeping run ID: $CURRENT_RUN_ID)..."
          gh api --paginate "repos/${REPO}/actions/runs?per_page=100" \
            | jq -rs --arg rid "$CURRENT_RUN_ID" '[.[].workflow_runs[]?] | .[] | select((.id | tostring) != $rid and .status == "completed") | .id' \
            | while read -r RUN_ID; do
                if [ -n "$RUN_ID" ]; then
                  echo "Deleting old workflow run ID=$RUN_ID"
                  gh api -X DELETE "repos/${REPO}/actions/runs/${RUN_ID}" || true
                fi
              done

          echo "Cleanup complete. Only the latest release and latest workflow run are kept."
